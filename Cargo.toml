[package]
name = "claudiu"
version = "0.5.3"
edition = "2024"
description = "A native workspace for Claude Code sessions: real PTYs, projects, and session history"
repository = "https://github.com/m4rocks/claudiu"
publish = false

[workspace]
members = ["crates/core"]

[dependencies]
alacritty_terminal = "0.26.0"
anyhow = "1.0.104"
directories = "6.0.0"
dunce = "1.0.5"
futures = "0.3.34"
git2 = { version = "0.21.0", default-features = false }
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui-kit = { version = "0.7.1", default-features = false, features = ["component", "assets"] }
raw-window-handle = "0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
image = { version = "0.25", default-features = false, features = ["png", "bmp", "jpeg", "gif", "webp"] }
ureq = "3.4.2"
time = { version = "0.3.55", features = ["parsing"] }
uuid = { version = "1.27.0", features = ["v4"] }
velopack = "1.2.161"
which = "8.0.6"

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.8", features = ["test-support"] }
gpui-kit = { version = "0.7.1", default-features = false, features = ["component", "test-support"] }
tempfile = "3.27.0"

[build-dependencies]
winresource = "0.1.31"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[target."cfg(windows)".dependencies]
junction = "2.1.0"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Security", "Win32_System_DataExchange", "Win32_System_Memory"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication"] }

[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
debug = false
# gpui lays out and paints every element on every frame; unoptimised it makes a busy session visibly laggy.
opt-level = 2
