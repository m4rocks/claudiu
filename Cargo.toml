[package]
name = "claudiu"
version = "0.9.1"
edition = "2024"
description = "A native workspace for Claude Code sessions: real PTYs, projects, and session history"
repository = "https://github.com/m4rocks/claudiu"
publish = false

[dependencies]
alacritty_terminal = "0.26.0"
anyhow = "1.0.104"
directories = "6.0.0"
dunce = "1.0.5"
futures = "0.3.34"
# Editor mode's file tree follows its folder on disk.
notify = "8.2.0"
git2 = { version = "0.21.0", default-features = false }
# The types editor mode's language servers (`lsp`) speak.
lsp-types = "0.97.0"
# The UI: views, layout, text, springs and the native window. Pre-release, so pinned to a commit of its `dev` branch.
rune = { git = "https://github.com/anomalyco/rune", rev = "a7f276c3630f85a06a0230295da4d2bd172d8d3b", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "a7f276c3630f85a06a0230295da4d2bd172d8d3b", features = ["markdown"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
# File links (OSC 8) a program prints in the terminal.
url = "2.5.8"
image = { version = "0.25", default-features = false, features = ["png", "bmp", "jpeg", "gif", "webp"] }
ureq = "3.4.2"
time = { version = "0.3.55", features = ["parsing"] }
# Editor mode's syntax colours: the grammars of the languages `files::language` names, and their highlight queries.
tree-sitter = "0.26"
tree-sitter-highlight = "0.26"
tree-sitter-bash = "0.23.3"
tree-sitter-css = "0.23.2"
tree-sitter-gleam = "1.0.0"
tree-sitter-html = "0.23.2"
tree-sitter-javascript = "0.23.1"
tree-sitter-json = "0.24.8"
tree-sitter-md = "0.5.4"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"
# Where the editor may wrap a long line (Unicode line breaking) and never split a character the user sees, as main's
# GPUI editor wrapped; main's build had both.
unicode-linebreak = "0.1.5"
unicode-segmentation = "1.13.3"
# How many cells a character takes in the editor (wide CJK and emoji take two).
unicode-width = "0.2.2"
uuid = { version = "1.27.0", features = ["v4"] }
# 1.2.161 requires zip ^8.6. This release is the first published one that allows zip 9.
velopack = "1.3.39-g8d2844f"
which = "8.0.6"

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
winresource = "0.1.31"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[target."cfg(windows)".dependencies]
# The main window's handle, to flash its taskbar button (`platform::request_attention`).
raw-window-handle = "0.6"
junction = "2.1.0"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Security", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSMenu", "NSMenuItem"] }

[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
debug = false
# Rune lays out and draws on the UI thread; unoptimised dependencies make a busy session visibly laggy.
opt-level = 2
