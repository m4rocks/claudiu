[package]
name = "claudiu"
version = "0.6.3"
edition = "2024"
description = "A native workspace for Claude Code sessions: real PTYs, projects, and session history"
repository = "https://github.com/m4rocks/claudiu"
publish = false

[dependencies]
alacritty_terminal = "0.26.0"
anyhow = "1.0.104"
directories = "6.0.0"
dunce = "1.0.5"
futures = "0.3.34"
git2 = { version = "0.21.0", default-features = false }
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui-kit = { version = "0.7.1", default-features = false, features = [
    "component",
    "assets",
    # Editor mode's syntax highlighting; each grammar adds to the binary, so only these.
    "tree-sitter-bash",
    "tree-sitter-css",
    "tree-sitter-html",
    "tree-sitter-javascript",
    "tree-sitter-markdown",
    "tree-sitter-markdown-inline",
    "tree-sitter-rust",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
raw-window-handle = "0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
# The same versions gpui-kit's editor uses for its LSP hooks; editor mode's language servers (`lsp`) speak through them.
lsp-types = "0.97.0"
url = "2.5.8"
# Editor mode's file tree follows its folder on disk; already in the build through gpui-kit.
notify = "8.2.0"
image = { version = "0.25", default-features = false, features = ["png", "bmp", "jpeg", "gif", "webp"] }
ureq = "3.4.2"
time = { version = "0.3.55", features = ["parsing"] }
# Gleam is not among gpui-kit's grammars; registered in `app::editor_mode::register_languages`.
tree-sitter-gleam = "1.0.0"
uuid = { version = "1.27.0", features = ["v4"] }
velopack = "1.2.161"
which = "8.0.6"

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.8", features = ["test-support"] }
gpui-kit = { version = "0.7.1", default-features = false, features = ["component", "test-support"] }
tempfile = "3.27.0"

[build-dependencies]
winresource = "0.1.31"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[target."cfg(windows)".dependencies]
junction = "2.1.0"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Security", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication"] }

[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
debug = false
# gpui lays out and paints every element on every frame; unoptimised it makes a busy session visibly laggy.
opt-level = 2

# gpui-base 0.7.1 drew an editor's `set_scroll_offset` unclamped for one frame, so a wheel glide past either end
# overshot and jumped back. Patched in `vendor/gpui-base` (`clamp_deferred_scroll_top` in src/input/base/element.rs);
# drop this once gpui-kit releases the fix and has an action to open the completion menu by hand. The patch adds
# `TriggerCompletion` (Ctrl+Space) and has a menu opened that way follow its word as it grows
# (`handle_completion_trigger` in src/input/editor/lsp/completions.rs). It also makes `has_multiple_cursors`, `select_range`
# and `replace_range` public, which the line actions (src/app/line_actions.rs) edit through, and makes a drag that began
# with a double click select whole words (`snap_to_word_edge` in src/input/base/selection.rs).
[patch.crates-io]
gpui-base = { path = "vendor/gpui-base" }

[workspace]
# Not a member, so `profile.dev.package."*"` still builds it optimised like the other dependencies.
exclude = ["vendor"]
