name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Metal toolchain (macOS; GPUI compiles shaders)
        if: runner.os == 'macOS'
        run: xcrun -f metal >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      - name: Build
        run: cargo build --locked
      - name: Unit tests (store/reconcile, claude import, git, keys, glyphs, process lifecycle)
        run: cargo test --locked

  # Release builds only run on tags, and a tag can restore caches from main but not from other tags. So build the
  # release dependencies here, under the same shared-key as release.yml, and tag runs start warm.
  warm-release-cache:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, key: release-win, targets: "" }
          - { os: macos-latest, key: release-mac, targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.key }}
      - name: Metal toolchain (macOS; GPUI compiles shaders)
        if: runner.os == 'macOS'
        run: xcrun -f metal >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      - name: Build release
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            cargo build --release --locked --target aarch64-apple-darwin
            cargo build --release --locked --target x86_64-apple-darwin
          else
            cargo build --release --locked
          fi
