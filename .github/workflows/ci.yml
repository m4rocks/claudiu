name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries (Linux; Rune's Wayland and keyboard backends, and Vulkan)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev libvulkan1 zlib1g-dev
      - name: Build
        run: cargo build --locked
      - name: Install just
        uses: taiki-e/install-action@just
      - name: Install Claude Code CLI (for the mod tests)
        run: npm install -g @anthropic-ai/claude-code@2.1.309
      - name: Tests (app unit tests, then mod tests)
        run: just test
