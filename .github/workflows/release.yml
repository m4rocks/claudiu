name: release

# Push a tag like v0.2.0 to publish installers and the auto-update feed to GitHub Releases.
# Installed copies of Claudiu check this repository's releases (Velopack GithubSource) and update themselves.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-win # restored from the cache ci.yml builds on main; tag caches can't be shared, so don't save
          save-if: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - name: Install Velopack CLI
        run: dotnet tool install -g vpk
      - name: Version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build
        run: cargo build --release --locked
      - name: Fetch previous release (for delta updates)
        continue-on-error: true # none exists for the first release
        run: vpk download github --repoUrl "${{ github.server_url }}/${{ github.repository }}" --token "${{ secrets.GITHUB_TOKEN }}"
      - name: Pack
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/publish | Out-Null
          Copy-Item target/release/claudiu.exe dist/publish/
          vpk pack --packId Claudiu --packVersion "${{ steps.ver.outputs.version }}" --packDir dist/publish --mainExe claudiu.exe --packTitle Claudiu --icon assets/claudiu.ico --outputDir dist/releases
      - uses: actions/upload-artifact@v4
        with:
          name: releases-win
          path: dist/releases

  macos:
    # One universal (arm64 + x86_64) build, ad-hoc signed (--signAppIdentity -): Gatekeeper still warns until a
    # Developer ID identity is added (vpk --signAppIdentity / --notaryProfile).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-mac
          save-if: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - name: Install Velopack CLI
        run: dotnet tool install -g vpk
      - name: Metal toolchain (GPUI compiles shaders; newer Xcodes ship it as a download)
        run: xcrun -f metal >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      - name: Version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build (universal)
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p dist/publish
          lipo -create -output dist/publish/claudiu target/aarch64-apple-darwin/release/claudiu target/x86_64-apple-darwin/release/claudiu
          codesign --force --sign - dist/publish/claudiu   # lipo invalidates the per-arch signatures
      - name: Icon
        run: scripts/make-icns.sh dist/claudiu.icns
      - name: Fetch previous release (for delta updates)
        continue-on-error: true
        run: vpk download github --repoUrl "${{ github.server_url }}/${{ github.repository }}" --token "${{ secrets.GITHUB_TOKEN }}"
      - name: Pack
        run: vpk pack --packId Claudiu --packVersion "${{ steps.ver.outputs.version }}" --packDir dist/publish --mainExe claudiu --packTitle Claudiu --icon dist/claudiu.icns --bundleId com.m4rocks.claudiu --signAppIdentity - --outputDir dist/releases
      - uses: actions/upload-artifact@v4
        with:
          name: releases-osx
          path: dist/releases

  publish:
    # The builds run in parallel; uploading from one job afterwards avoids both racing to create the release.
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - name: Install Velopack CLI
        run: dotnet tool install -g vpk
      - name: Upload
        run: |
          version="${GITHUB_REF_NAME#v}"
          for channel in win osx; do
            vpk upload github --channel "$channel" --repoUrl "${{ github.server_url }}/${{ github.repository }}" --outputDir "releases-$channel" --merge --publish --releaseName "Claudiu $version" --tag "${{ github.ref_name }}" --token "${{ secrets.GITHUB_TOKEN }}"
          done
